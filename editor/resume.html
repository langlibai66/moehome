<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoeWah · 简历编辑</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <header class="editor-header">
        <div class="header-left">
            <span class="logo"><span class="prompt">$</span> <span class="logo-text">简历编辑</span></span>
        </div>
        <div class="header-center">
            <span class="save-status" id="save-status">
                <i class="fa-solid fa-circle-check"></i> 已保存
            </span>
        </div>
        <div class="header-right">
            <button class="btn btn-secondary" id="btn-back-home" title="返回主页编辑器">
                <i class="fa-solid fa-arrow-left"></i> 主页编辑
            </button>
            <button class="btn btn-secondary" id="btn-save" title="保存到 src/resume.js 并重建预览">
                <i class="fa-solid fa-floppy-disk"></i> 保存
            </button>
            <button class="btn btn-primary" id="btn-build" title="保存并重建 dist/resume/">
                <i class="fa-solid fa-eye"></i> 构建预览
            </button>
        </div>
    </header>

    <div class="server-banner hidden" id="server-banner">
        <i class="fa-solid fa-plug-circle-xmark"></i>
        <span>编辑器服务已停止 — 双击 <b>project/start-editor.bat</b> 重启服务，然后刷新本页</span>
    </div>

    <main class="editor-main">
        <aside class="cards-panel" id="cards-panel">
            <div class="panel-header">
                <h2>简历配置</h2>
                <div class="panel-actions">
                    <button class="btn-icon" id="btn-collapse-all" title="全部折叠"><i class="fa-solid fa-compress"></i></button>
                    <button class="btn-icon" id="btn-expand-all" title="全部展开"><i class="fa-solid fa-expand"></i></button>
                </div>
            </div>
            <div class="cards-scroll" id="cards-container"></div>
        </aside>
        <div class="panel-resizer" id="panel-resizer"></div>
        <section class="preview-panel">
            <div class="preview-header">
                <div class="preview-tabs">
                    <button class="preview-tab active" data-view="preview"><i class="fa-solid fa-eye"></i> 预览</button>
                    <button class="preview-tab" data-view="config"><i class="fa-solid fa-code"></i> 源码</button>
                </div>
                <button class="btn-icon" id="btn-refresh-preview" title="刷新预览"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="preview-body" id="preview-body">
                <div class="preview-placeholder" id="preview-placeholder">
                    <div class="preview-placeholder-content">
                        <i class="fa-solid fa-eye"></i>
                        <p>预览右侧栏内嵌显示</p>
                        <p style="font-size:11px;color:var(--text3);margin-top:4px">修改后点「构建预览」刷新</p>
                    </div>
                </div>
                <div class="preview-frame-wrap hidden" id="preview-frame-wrap">
                    <div class="preview-url-bar">
                        <span class="preview-url" id="preview-url"></span>
                        <div class="preview-url-actions">
                            <button class="btn-icon" id="btn-open-new-tab" title="在新标签页打开"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
                            <button class="btn-icon" id="btn-close-preview" title="关闭预览"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
                </div>
                <pre id="config-source" class="hidden"><code id="config-code"></code></pre>
            </div>
        </section>
    </main>

    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <script src="resume.js"></script>
</body>
</html>
